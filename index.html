  <script>
    (function () {
      var c = document.querySelector('.collage');
      if (!c) return;
      var track = c.querySelector('.c-track');
      var items = track.querySelectorAll('.c-item');
      var dots = c.querySelector('.c-dots');
      var phone = window.matchMedia('(max-width: 760px)');
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var timer;
      items.forEach(function () { dots.appendChild(document.createElement('span')); });
      function current() {
        var mid = track.scrollLeft + track.clientWidth / 2, best = 0, d = 1e9;
        items.forEach(function (it, k) {
          var dd = Math.abs(it.offsetLeft + it.offsetWidth / 2 - mid);
          if (dd < d) { d = dd; best = k; }
        });
        return best;
      }
      function go(n) {
        n = (n + items.length) % items.length;
        var it = items[n];
        track.scrollTo({ left: it.offsetLeft - (track.clientWidth - it.offsetWidth) / 2 });
      }
      function mark() {
        var k = current();
        dots.querySelectorAll('span').forEach(function (d, j) { d.classList.toggle('on', j === k); });
      }
      function start() { clearInterval(timer); if (phone.matches && !still) timer = setInterval(function () { go(current() + 1); }, 5000); }
      c.querySelectorAll('[data-dir]').forEach(function (b) {
        b.addEventListener('click', function () { go(current() + Number(b.dataset.dir)); start(); });
      });
      track.addEventListener('scroll', mark, { passive: true });
      track.addEventListener('touchstart', function () { clearInterval(timer); }, { passive: true });
      track.addEventListener('touchend', start, { passive: true });
      if (phone.addEventListener) phone.addEventListener('change', start);
      mark(); start();
    })();
  </script>
